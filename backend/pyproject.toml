[project]
name = "migration-studio-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.1",
  "pydantic-settings>=2.5",
  "langgraph>=1.2",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",  # PostgreSQL
  "oracledb>=2.5",  # Oracle 19c+, thin mode: no Oracle Client install needed
  "github-copilot-sdk>=1.0.16",
  "truststore>=0.10",
  "pyyaml>=6",
  "anthropic>=1.11",  # only used when Claude is the AI provider
  "sse-starlette>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
